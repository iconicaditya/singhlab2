services:
  - type: web
    name: singh-lab-backend
    env: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: singh-lab-db
          property: connectionString
      - key: FRONTEND_URL
        value: https://singh-lab-environment-website.vercel.app
      - key: PORT
        value: 5000
